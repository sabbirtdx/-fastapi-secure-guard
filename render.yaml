# Render blueprint — https://render.com/docs/blueprint-spec
services:
  - type: web
    name: secure-file-guard
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    envVars:
      - key: SFG_ADMIN_EMAIL
        sync: false
      - key: SFG_ADMIN_PASSWORD
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.8
    healthCheckPath: /api/healthz
